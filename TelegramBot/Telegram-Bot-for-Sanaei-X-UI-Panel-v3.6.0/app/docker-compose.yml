# =============================================
# Telegram Bot for Sanaei X-UI Panel
# Docker Compose - Development & Production
# =============================================

version: '3.8'

services:
  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:15-alpine
    container_name: telegram-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-telegram_bot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-telegram_bot_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - telegram-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-telegram_bot} -d ${DB_NAME:-telegram_bot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Redis Cache ============
  redis:
    image: redis:7-alpine
    container_name: telegram-bot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - telegram-bot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Main Application ============
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-bot-app
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-telegram_bot}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password}
      DB_NAME: ${DB_NAME:-telegram_bot_db}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      
      # Application
      BOT_TOKEN: ${BOT_TOKEN}
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-False}
      
      # Admin
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      
      # X-UI
      XUI_URL: ${XUI_URL:-}
      XUI_USERNAME: ${XUI_USERNAME:-admin}
      XUI_PASSWORD: ${XUI_PASSWORD:-admin}
      XUI_INBOUND_ID: ${XUI_INBOUND_ID:-2}
    volumes:
      - ./app:/app
      - ./admin_panel:/app/admin_panel
      - ./static:/app/static
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - telegram-bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============ Nginx (Optional - for production) ============
  nginx:
    image: nginx:alpine
    container_name: telegram-bot-nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:ro
      - ./ssl:/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    networks:
      - telegram-bot-network
    profiles:
      - production

  # ============ Backup Service ============
  backup:
    image: alpine:latest
    container_name: telegram-bot-backup
    restart: unless-stopped
    volumes:
      - postgres_data:/backup/postgres:ro
      - ./backups:/backups
    environment:
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 2 * * *}
      - DB_USER=${DB_USER:-telegram_bot}
      - DB_PASSWORD=${DB_PASSWORD:-secure_password}
      - DB_NAME=${DB_NAME:-telegram_bot_db}
      - DB_HOST=postgres
    entrypoint: |
      sh -c "
      apk add --no-cache postgresql-client tzdata
      echo '#!/bin/sh
      /usr/bin/pg_dump -h postgres -U $DB_USER $DB_NAME > /backups/backup_\$(date +%Y%m%d_%H%M%S).sql
      find /backups -name \"backup_*.sql\" -mtime +7 -delete
      ' > /backup.sh
      chmod +x /backup.sh
      echo \"\$BACKUP_SCHEDULE /backup.sh\" > /etc/crontab
      crond -f
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telegram-bot-network
    profiles:
      - production

# ============ Volumes ============
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ============ Networks ============
networks:
  telegram-bot-network:
    driver: bridge