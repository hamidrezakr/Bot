version: '3.8'

services:
  bot:
    build: .
    container_name: telegram-xui-bot
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persistent data
      - /data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./data/telegram_bot.db
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  bot-network:
    driver: bridge

volumes:
  bot-data:
