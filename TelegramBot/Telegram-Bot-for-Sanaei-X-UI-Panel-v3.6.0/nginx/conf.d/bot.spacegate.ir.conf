server {
    listen 80;
    server_name bot.spacegate.ir;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bot.spacegate.ir;

    ssl_certificate /etc/letsencrypt/live/bot.spacegate.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.spacegate.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ==============================================
    # Block Sensitive Files & Paths
    # ==============================================

    # Block all dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block PHP files
    location ~* \.php$ {
        deny all;
        return 404;
    }

    # Block common scan paths (PHP, WordPress, etc.)
    location ~* (phpunit|phpmyadmin|wp-admin|wp-login|wp-content|xmlrpc\.php|setup\.php|eval-stdin|think\\app|vendor/|laravel|symfony|drupal|joomla|typo3) {
        deny all;
        return 404;
    }

    # Block sensitive file extensions (بدون json)
    location ~* \.(env|git|htaccess|htpasswd|bak|old|sql|log|conf|ini|yml|yaml|lock)$ {
        deny all;
        return 404;
    }

    # Request Size Limits
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 30s;

    # Redirect root to admin
    location = / {
        return 301 https://bot.spacegate.ir/admin/dashboard;
    }

    # Webhook with higher limits for Telegram
    location /webhook {
        limit_req zone=webhook_limit burst=100 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 30;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Login with strict limits
    location = /admin/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 5;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin/api/login {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 5;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API with general limits
    location /admin/api/ {
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 30;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # All other requests
    location / {
        limit_req zone=api_limit burst=100 nodelay;
        limit_req_status 429;
        limit_conn conn_limit 30;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
