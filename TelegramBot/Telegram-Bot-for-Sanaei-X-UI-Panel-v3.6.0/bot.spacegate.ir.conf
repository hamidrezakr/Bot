server {
    listen 80;
    server_name bot.spacegate.ir;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bot.spacegate.ir;

    ssl_certificate /etc/letsencrypt/live/bot.spacegate.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.spacegate.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ==============================================
    # ریدایرکت ریشه دامنه به پنل ادمین
    # ==============================================
    location = / {
        return 301 https://bot.spacegate.ir/admin/dashboard;
    }

    # ==============================================
    # پروکسی تمام درخواست‌های دیگر به FastAPI
    # ==============================================
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy به FastAPI برای Webhook
    location /webhook {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
