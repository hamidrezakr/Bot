{% extends "base.html" %}

{% block title %}مدیریت سرویس‌ها{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-cubes"></i> مدیریت سرویس‌ها</h5>
            </div>
            <div class="card-body">
                <!-- فرم افزودن سرویس -->
                <form id="addServiceForm" class="row g-3 mb-4">
                    <div class="col-md-3">
                        <label class="form-label">نام سرویس</label>
                        <input type="text" id="serviceName" class="form-control" placeholder="مثال: VIP 100GB" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">حجم (GB)</label>
                        <input type="number" id="serviceVolume" class="form-control" placeholder="100" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">مدت (روز)</label>
                        <input type="number" id="serviceDuration" class="form-control" placeholder="30" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">قیمت (تومان)</label>
                        <input type="number" id="servicePrice" class="form-control" placeholder="50000" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">وضعیت</label>
                        <select id="serviceStatus" class="form-select">
                            <option value="active">فعال</option>
                            <option value="inactive">غیرفعال</option>
                        </select>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </form>
                
                <hr>
                
                <!-- لیست سرویس‌ها -->
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>نام</th>
                            <th>حجم</th>
                            <th>مدت</th>
                            <th>قیمت</th>
                            <th>وضعیت</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="servicesTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/services.js"></script>
{% endblock %}
