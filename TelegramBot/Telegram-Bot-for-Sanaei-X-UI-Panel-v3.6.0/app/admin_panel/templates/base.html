<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}پنل مدیریت بات X-UI{% endblock %}</title>

    <!-- Bootstrap RTL -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <div class="wrapper">
      <!-- Sidebar -->
      <nav id="sidebar" class="bg-dark text-white">
        <div class="sidebar-header p-3">
          <h4>🤖 X-UI Bot</h4>
          <small>پنل مدیریت</small>
        </div>

        <ul class="list-unstyled components p-3">
          <li class="{% if active_tab == 'dashboard' %}active{% endif %}">
            <a href="/admin/dashboard">
              <i class="fas fa-chart-pie"></i> داشبورد
            </a>
          </li>
          <li class="{% if active_tab == 'panels' %}active{% endif %}">
            <a href="/admin/panels"> <i class="fas fa-server"></i> پنل‌ها </a>
          </li>
          <li class="{% if active_tab == 'services' %}active{% endif %}">
            <a href="/admin/services">
              <i class="fas fa-cubes"></i> سرویس‌ها
            </a>
          </li>
          <li class="{% if active_tab == 'payments' %}active{% endif %}">
            <a href="/admin/payments">
              <i class="fas fa-credit-card"></i> لینک‌های پرداخت
            </a>
          </li>
          <li class="{% if active_tab == 'invoices' %}active{% endif %}">
            <a href="/admin/invoices">
              <i class="fas fa-file-invoice"></i> رسیدها
            </a>
          </li>
          <li class="{% if active_tab == 'reports' %}active{% endif %}">
            <a href="/admin/reports">
              <i class="fas fa-chart-line"></i> گزارشات
            </a>
          </li>
          <li class="{% if active_tab == 'settings' %}active{% endif %}">
            <a href="/admin/settings"> <i class="fas fa-cog"></i> تنظیمات </a>
          </li>
        </ul>

        <div class="sidebar-footer p-3">
          <a href="/admin/logout" class="text-white">
            <i class="fas fa-sign-out-alt"></i> خروج
          </a>
        </div>
      </nav>

      <!-- Page Content -->
      <div id="content">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
          <div class="container-fluid">
            <button type="button" id="sidebarCollapse" class="btn btn-info">
              <i class="fas fa-bars"></i>
            </button>
            <span class="navbar-text"> خوش آمدید {{ admin_username }} </span>
          </div>
        </nav>

        <div class="container-fluid p-4">{% block content %}{% endblock %}</div>
      </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="/static/js/dashboard.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
