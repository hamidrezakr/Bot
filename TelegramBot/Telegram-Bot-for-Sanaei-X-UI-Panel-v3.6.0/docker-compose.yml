services:
  bot:
    build: .
    container_name: telegram-xui-bot
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - /data/telegram_bot.db:/app/telegram_bot.db
      - /data/receipts:/app/receipts
      - /data/broadcast_photos:/app/broadcast_photos
      - /data/bot.log:/app/bot.log
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - RES_OPTIONS=single-request-reopen
    # Disable IPv6 in container
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    # DNS servers (NEW)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - bot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  bot-network:
    driver: bridge
