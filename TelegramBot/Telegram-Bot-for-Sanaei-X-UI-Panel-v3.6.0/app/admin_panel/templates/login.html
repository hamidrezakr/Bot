<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت</title>
    
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Vazir', 'Tahoma', sans-serif;
            direction: rtl;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .login-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-card .logo h2 {
            color: #1a1a2e;
            font-weight: 700;
        }
        
        .login-card .logo p {
            color: #666;
            font-size: 14px;
        }
        
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #0f3460;
            box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1);
        }
        
        .btn-login {
            background: #0f3460;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            border: none;
            transition: all 0.3s;
        }
        
        .btn-login:hover {
            background: #1a1a2e;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(15, 52, 96, 0.3);
        }
        
        .captcha-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .captcha-container img {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            height: 70px;
        }
        
        .captcha-container .refresh-btn {
            background: none;
            border: none;
            color: #0f3460;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .captcha-container .refresh-btn:hover {
            transform: rotate(180deg);
        }
        
        .alert {
            border-radius: 10px;
            display: none;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
        
        .failed-attempts {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="fas fa-robot" style="font-size: 48px; color: #0f3460;"></i>
            <h2>🤖 X-UI Bot</h2>
            <p>پنل مدیریت بات تلگرام</p>
        </div>
        
        <!-- Alert for errors -->
        <div id="loginAlert" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span id="alertMessage">خطا در ورود</span>
        </div>
        
        <!-- Failed attempts warning -->
        <div id="failedAttempts" class="failed-attempts">
            <i class="fas fa-exclamation-triangle"></i>
            <span>تعداد تلاش‌های ناموفق: <span id="attemptCount">0</span></span>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">نام کاربری</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" id="username" class="form-control" 
                           placeholder="نام کاربری خود را وارد کنید" required autocomplete="username">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">رمز عبور</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" 
                           placeholder="رمز عبور خود را وارد کنید" required autocomplete="current-password">
                </div>
            </div>
            
            <div class="mb-3">
                <label class="form-label">کد امنیتی (CAPTCHA)</label>
                <div class="captcha-container">
                    <img id="captchaImage" src="/admin/api/captcha/generate" alt="CAPTCHA" title="برای تغییر کلیک کنید">
                    <button type="button" class="refresh-btn" id="refreshCaptcha" title="تغییر کد">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <div class="flex-grow-1">
                        <input type="text" id="captchaInput" class="form-control" 
                               placeholder="کد امنیتی را وارد کنید" required maxlength="6" autocomplete="off">
                    </div>
                </div>
                <small class="text-muted">کد امنیتی را به صورت دقیق وارد کنید (حروف بزرگ و کوچک فرقی ندارد)</small>
            </div>
            
            <input type="hidden" id="captchaId" value="">
            
            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> ورود به پنل
            </button>
        </form>
        
        <div class="login-footer">
            <small>ورود فقط برای مدیران سیستم مجاز است</small>
        </div>
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            let failedAttempts = 0;
            const MAX_ATTEMPTS = 5;
            
            // ============ Check if already logged in ============
            $.ajax({
                url: '/admin/api/auth/verify',
                method: 'GET',
                success: function(response) {
                    if (response.valid) {
                        window.location.href = '/admin/dashboard';
                    }
                }
            });
            
            // ============ Load CAPTCHA ============
            function loadCaptcha() {
                $.ajax({
                    url: '/admin/api/captcha/generate',
                    method: 'GET',
                    xhrFields: {
                        responseType: 'blob'
                    },
                    success: function(data, status, xhr) {
                        const captchaId = xhr.getResponseHeader('X-Captcha-Id');
                        $('#captchaId').val(captchaId);
                        
                        const url = URL.createObjectURL(data);
                        $('#captchaImage').attr('src', url);
                    },
                    error: function() {
                        showAlert('خطا در دریافت کد امنیتی');
                    }
                });
            }
            
            // Initial load
            loadCaptcha();
            
            // ============ Refresh CAPTCHA ============
            $('#refreshCaptcha').on('click', function() {
                loadCaptcha();
                $('#captchaInput').val('').focus();
            });
            
            $('#captchaImage').on('click', function() {
                loadCaptcha();
                $('#captchaInput').val('').focus();
            });
            
            // ============ Login form submit ============
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                
                const username = $('#username').val().trim();
                const password = $('#password').val().trim();
                const captchaInput = $('#captchaInput').val().trim();
                const captchaId = $('#captchaId').val();
                
                // ============ Validation ============
                if (!username || !password || !captchaInput) {
                    showAlert('لطفاً تمام فیلدها را پر کنید');
                    return;
                }
                
                if (captchaInput.length < 4) {
                    showAlert('کد امنیتی باید حداقل 4 کاراکتر باشد');
                    return;
                }
                
                // ============ Show loading ============
                const $btn = $('.btn-login');
                $btn.prop('disabled', true).html(
                    '<i class="fas fa-spinner fa-spin"></i> در حال بررسی...'
                );
                
                // ============ Send login request ============
                $.ajax({
                    url: '/admin/api/auth/login',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        username: username,
                        password: password,
                        captcha_id: captchaId,
                        captcha_input: captchaInput
                    }),
                    success: function(response) {
                        // Reset failed attempts
                        failedAttempts = 0;
                        $('#failedAttempts').hide();
                        
                        // Show success message
                        showAlert('✅ ورود موفق! در حال انتقال به داشبورد...', 'success');
                        
                        // Redirect to dashboard
                        setTimeout(function() {
                            window.location.href = '/admin/dashboard';
                        }, 1000);
                    },
                    error: function(xhr) {
                        // Increment failed attempts
                        failedAttempts++;
                        $('#attemptCount').text(failedAttempts);
                        
                        if (failedAttempts >= MAX_ATTEMPTS) {
                            $('#failedAttempts').show();
                            showAlert('⚠️ تلاش‌های ناموفق زیاد! لطفاً چند دقیقه صبر کنید.', 'warning');
                        } else {
                            $('#failedAttempts').show();
                        }
                        
                        let message = 'نام کاربری، رمز عبور یا کد امنیتی اشتباه است';
                        if (xhr.responseJSON && xhr.responseJSON.detail) {
                            message = xhr.responseJSON.detail;
                        }
                        showAlert(message);
                        
                        // Refresh CAPTCHA
                        loadCaptcha();
                        $('#captchaInput').val('');
                    },
                    complete: function() {
                        $btn.prop('disabled', false).html(
                            '<i class="fas fa-sign-in-alt"></i> ورود به پنل'
                        );
                    }
                });
            });
            
            // ============ Show alert ============
            function showAlert(message, type = 'danger') {
                const $alert = $('#loginAlert');
                const $message = $('#alertMessage');
                
                $alert.removeClass('alert-danger alert-success alert-warning');
                $alert.addClass('alert-' + type);
                
                $message.text(message);
                $alert.fadeIn(300);
                
                // Auto-hide after 5 seconds
                clearTimeout(window.alertTimeout);
                window.alertTimeout = setTimeout(function() {
                    $alert.fadeOut(300);
                }, 5000);
            }
        });
    </script>
</body>
</html>
